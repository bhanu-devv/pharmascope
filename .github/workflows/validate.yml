name: Validate PharmaScope
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/build_project.py
      - run: python src/build_dashboard.py
      - run: python tests/test_integrity.py
      - run: python tests/test_extended.py
